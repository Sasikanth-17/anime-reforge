[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-reforge"
version = "0.1.0"
description = "High-precision cinematic restyling and rotoscoping pipeline for animation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Core Dev"}]

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "diffusers>=0.28.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "controlnet-aux>=0.0.8",
    "av>=12.0.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0,<2.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.1",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0"
]

[project.scripts]
reforge = "reforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]